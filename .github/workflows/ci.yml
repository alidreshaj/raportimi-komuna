name: CI

# Çdo push dhe pull request: ndërton dhe provon backend-in dhe frontend-in.
on:
  push:
    branches: [main]
  pull_request:

# Token-i i workflow-t lexon vetëm kodin: nuk ka nevojë të shkruajë asgjë te repo.
permissions:
  contents: read

# Një push i ri anulon provën e vjetër të të njëjtit degë (kursen kohë dhe minuta).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # -warnaserror: një paralajmërim i ri (p.sh. null i mundshëm) e ndalon CI-në, që mos grumbullohen pa u vënë re.
      # Lokalisht mbeten paralajmërime, që `dotnet run` të mos bllokohet gjatë punës.
      - name: Ndërto pa paralajmërime
        run: dotnet build Backend.Tests/Backend.Tests.csproj -warnaserror
      - name: Provo
        run: dotnet test Backend.Tests/Backend.Tests.csproj --no-build

      # Nëse ndryshon një model (p.sh. shtohet një fushë) dhe harrohet `dotnet ef migrations add`, databaza e vërtetë
      # nuk do të përputhej me kodin. Kjo provë e kap para se të shkojë në prodhim. Nuk lidhet me databazë.
      - name: Kontrollo që migrimet janë të plota
        env:
          ASPNETCORE_ENVIRONMENT: Production
          # Në thonjëza: pa to YAML e lexon si numër (p.sh. 1.23e+38) dhe çelësi del shumë i shkurtër.
          Jwt__Key: "ci-only-key-not-secret-0123456789abcdef"
          ConnectionStrings__DefaultConnection: Host=unused
        # Logu i GitHub-it shihet vetëm me hyrje; nëse hapi dështon, 30 rreshtat e fundit dalin edhe si "annotation"
        # (te faqja e provës, dhe te API-ja publike), që shkaku të shihet pa hapur logun.
        run: |
          set -o pipefail
          { dotnet tool restore && dotnet ef migrations has-pending-model-changes --project Backend --verbose; } 2>&1 | tee ef.log || {
            echo "::error title=Migrimet::$(tail -n 30 ef.log | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
