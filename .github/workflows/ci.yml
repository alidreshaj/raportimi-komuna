name: CI

# Çdo push dhe pull request: ndërton dhe provon backend-in dhe frontend-in.
on:
  push:
    branches: [main]
  pull_request:

# Token-i i workflow-t lexon vetëm kodin: nuk ka nevojë të shkruajë asgjë te repo.
permissions:
  contents: read

# Një push i ri anulon provën e vjetër të të njëjtit degë (kursen kohë dhe minuta).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ndërto dhe provo
        run: dotnet test Backend.Tests/Backend.Tests.csproj

      # Nëse ndryshon një model (p.sh. shtohet një fushë) dhe harrohet `dotnet ef migrations add`, databaza e vërtetë
      # nuk do të përputhej me kodin. Kjo provë e kap para se të shkojë në prodhim. Nuk lidhet me databazë.
      - name: Kontrollo që migrimet janë të plota
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Jwt__Key: 0123456789012345678901234567890123456789
          ConnectionStrings__DefaultConnection: Host=unused
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes --project Backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
