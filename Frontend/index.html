<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ngjyra e shiritit te telefoni; ndërrohet vetë me temën (utils/theme.ts). -->
    <meta name="theme-color" content="#ffffff" />
    <title>Raportimi në komunë</title>
    <!-- Tema vendoset para se faqja të pikturohet (ruajtja e përdoruesit, përndryshe sistemi), që të mos ketë dritë të bardhë për një çast. -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme !== 'dark' && theme !== 'light') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if ('startViewTransition' in document) document.documentElement.classList.add('has-vt')
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
